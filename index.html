<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mini JJ Studio</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#050507;
  color:#fff;
}

body{
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  left:50%;
  top:0;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(130,90,255,.18),transparent 68%);
  filter:blur(35px);
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  left:50%;
  bottom:-100px;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(0,210,255,.09),transparent 70%);
  filter:blur(45px);
  pointer-events:none;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:25px 16px 45px;
  position:relative;
  z-index:2;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:24px;
}

.logo{
  width:58px;
  height:58px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:linear-gradient(145deg,#fff,#aaa);
  color:#000;
  font-size:25px;
  box-shadow:0 10px 45px rgba(255,255,255,.12);
}

.title{
  margin-top:13px;
  font-size:29px;
  font-weight:800;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:5px;
  color:#777;
  font-size:13px;
}

/* CARD */

.card{
  width:100%;
  margin-top:14px;
  padding:18px;
  border-radius:24px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 15px 55px rgba(0,0,0,.25);
  backdrop-filter:blur(18px);
}

.section-title{
  text-align:center;
  margin-bottom:13px;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  color:#aaa;
}

/* UPLOAD */

.upload{
  position:relative;
  padding:22px 14px;
  text-align:center;
  border:1px dashed #343438;
  border-radius:18px;
  transition:.2s;
}

.upload:active{
  transform:scale(.98);
}

.upload-icon{
  font-size:30px;
  margin-bottom:8px;
}

.upload-title{
  font-size:14px;
  font-weight:700;
}

.upload-sub{
  margin-top:5px;
  color:#666;
  font-size:11px;
}

.upload input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
}

/* FOTO */

.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:13px;
}

.photo{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:12px;
  background:#141416;
  border:1px solid rgba(255,255,255,.08);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MUSIC */

.music-info{
  display:none;
  text-align:center;
  margin-top:13px;
}

.music-name{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.music-duration{
  color:#777;
  font-size:12px;
  margin-top:5px;
}

.music-valid{
  display:inline-block;
  margin-top:10px;
  padding:7px 12px;
  border-radius:30px;
  background:rgba(255,255,255,.06);
  color:#aaa;
  font-size:10px;
}

/* PREVIEW */

.preview-card{
  padding:15px;
}

.preview{
  width:min(100%,330px);
  aspect-ratio:9/16;
  margin:auto;
  overflow:hidden;
  position:relative;
  border-radius:23px;
  background:#0b0b0d;
  box-shadow:0 20px 75px rgba(0,0,0,.6);
}

.preview-label{
  position:absolute;
  z-index:5;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  padding:6px 10px;
  border-radius:30px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  color:#aaa;
  font-size:9px;
  letter-spacing:1px;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.bass-wrap{
  margin-top:13px;
}

.bass-track{
  width:100%;
  height:6px;
  overflow:hidden;
  border-radius:10px;
  background:#19191c;
}

#bassBar{
  width:0%;
  height:100%;
  border-radius:10px;
  background:linear-gradient(90deg,#fff,#aaa);
}

.bass-info{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  color:#666;
  font-size:10px;
}

/* SELECT */

select{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #29292d;
  outline:none;
  background:#111114;
  color:#fff;
  text-align:center;
}

/* SLIDER */

.range{
  width:100%;
  accent-color:#fff;
}

.range-info{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
  color:#666;
  font-size:10px;
}

/* BUTTON */

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:15px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:active{
  transform:scale(.97);
}

.primary{
  background:#fff;
  color:#000;
}

.secondary{
  background:#1a1a1d;
  color:#fff;
  border:1px solid rgba(255,255,255,.07);
}

.render{
  margin-top:9px;
  background:linear-gradient(135deg,#fff,#bbb);
  color:#000;
}

button:disabled{
  opacity:.35;
  pointer-events:none;
}

/* STATUS */

.status{
  min-height:18px;
  margin-top:13px;
  text-align:center;
  color:#777;
  font-size:11px;
  line-height:1.5;
}

/* DOWNLOAD */

.download{
  display:none;
  width:100%;
  margin-top:10px;
  padding:14px;
  text-align:center;
  text-decoration:none;
  border-radius:15px;
  background:#fff;
  color:#000;
  font-size:13px;
  font-weight:800;
}

/* FOOTER */

.footer{
  margin-top:20px;
  text-align:center;
  color:#3d3d42;
  font-size:10px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">⚡</div>

    <div class="title">
      Mini JJ Studio
    </div>

    <div class="subtitle">
      Beat-sync photo editor
    </div>

  </div>


  <!-- FOTO -->

  <div class="card">

    <div class="section-title">
      FOTO
    </div>

    <div class="upload">

      <div class="upload-icon">
        📸
      </div>

      <div class="upload-title">
        Tambahkan Foto
      </div>

      <div class="upload-sub">
        Maksimal 7 foto
      </div>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
      >

    </div>

    <div
      id="photoGrid"
      class="photo-grid">
    </div>

  </div>


  <!-- MUSIK -->

  <div class="card">

    <div class="section-title">
      MUSIK
    </div>

    <div class="upload">

      <div class="upload-icon">
        🎵
      </div>

      <div class="upload-title">
        Tambahkan Musik
      </div>

      <div class="upload-sub">
        Maksimal 35 detik
      </div>

      <input
        id="musicInput"
        type="file"
        accept="audio/*"
      >

    </div>

    <div
      id="musicInfo"
      class="music-info">

      <div
        id="musicName"
        class="music-name">
      </div>

      <div
        id="musicDuration"
        class="music-duration">
      </div>

      <div
        id="musicValid"
        class="music-valid">
      </div>

    </div>

  </div>


  <!-- PREVIEW -->

  <div class="card preview-card">

    <div class="section-title">
      PREVIEW
    </div>

    <div class="preview">

      <div class="preview-label">
        9 : 16
      </div>

      <canvas
        id="canvas"
        width="540"
        height="960">
      </canvas>

    </div>

    <div class="bass-wrap">

      <div class="bass-track">
        <div id="bassBar"></div>
      </div>

      <div class="bass-info">

        <span id="time">
          00:00
        </span>

        <span id="bass">
          BASS 0%
        </span>

      </div>

    </div>

  </div>


  <!-- MODE -->

  <div class="card">

    <div class="section-title">
      MODE JJ
    </div>

    <select id="effect">

      <option value="mix">
        ⚡ JJ MIX
      </option>

      <option value="zoom">
        🔍 Bass Zoom
      </option>

      <option value="shake">
        📳 Bass Shake
      </option>

      <option value="flash">
        ✨ Bass Flash
      </option>

      <option value="glitch">
        🌀 Glitch Beat
      </option>

      <option value="clean">
        ◌ Clean Beat
      </option>

    </select>

  </div>


  <!-- INTENSITAS -->

  <div class="card">

    <div class="section-title">
      INTENSITAS EFEK
    </div>

    <input
      id="intensity"
      class="range"
      type="range"
      min="0"
      max="100"
      value="70"
    >

    <div class="range-info">

      <span>HALUS</span>

      <span id="intensityText">
        70%
      </span>

      <span>EXTREME</span>

    </div>

  </div>


  <!-- CONTROL -->

  <div class="card">

    <div class="buttons">

      <button
        id="previewBtn"
        class="primary">

        ▶ PREVIEW

      </button>

      <button
        id="stopBtn"
        class="secondary">

        ■ STOP

      </button>

    </div>

    <button
      id="renderBtn"
      class="render"
      disabled>

      🎬 RENDER VIDEO

    </button>

    <div
      id="status"
      class="status">

      Masukkan foto dan musik
      untuk mulai.

    </div>

    <a
      id="download"
      class="download">

      ⬇ SIMPAN VIDEO

    </a>

  </div>


  <div class="footer">
    Mini JJ Studio • Beat Sync Engine
  </div>

</div>


<script>

/* =========================================
   ELEMENT
========================================= */

const photoInput =
document.getElementById("photoInput");

const musicInput =
document.getElementById("musicInput");

const photoGrid =
document.getElementById("photoGrid");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const musicInfo =
document.getElementById("musicInfo");

const musicName =
document.getElementById("musicName");

const musicDuration =
document.getElementById("musicDuration");

const musicValid =
document.getElementById("musicValid");

const status =
document.getElementById("status");

const bassBar =
document.getElementById("bassBar");

const bassText =
document.getElementById("bass");

const timeText =
document.getElementById("time");

const intensity =
document.getElementById("intensity");

const intensityText =
document.getElementById("intensityText");

const effect =
document.getElementById("effect");

const previewBtn =
document.getElementById("previewBtn");

const stopBtn =
document.getElementById("stopBtn");

const renderBtn =
document.getElementById("renderBtn");

const download =
document.getElementById("download");


/* =========================================
   VARIABLE
========================================= */

let photos = [];

let audioFile = null;

let audioURL = null;

let audio =
new Audio();

let audioCtx = null;

let analyser = null;

let source = null;

let destination = null;

let running = false;

let rendering = false;

let animationFrame = null;

let currentPhoto = 0;

let beatCount = 0;

let lastBeat = 0;

let previousBass = 0;

let recorder = null;

let chunks = [];


/* =========================================
   FOTO
========================================= */

photoInput.addEventListener(
"change",
async () => {

  const files =
  Array.from(
    photoInput.files
  ).slice(0,7);

  photos = [];

  photoGrid.innerHTML = "";

  for(
    const file of files
  ){

    const url =
    URL.createObjectURL(file);

    const img =
    await loadImage(url);

    photos.push(img);

    const box =
    document.createElement("div");

    box.className =
    "photo";

    const thumb =
    document.createElement("img");

    thumb.src = url;

    box.appendChild(thumb);

    photoGrid.appendChild(box);
  }

  if(photos.length){

    status.textContent =
    photos.length +
    " foto siap digunakan.";

    drawIdle();
  }
});


/* =========================================
   MUSIK
   MAX 35 DETIK
========================================= */

musicInput.addEventListener(
"change",
async () => {

  const file =
  musicInput.files[0];

  if(!file)
  return;

  audioFile = file;

  if(audioURL){

    URL.revokeObjectURL(
      audioURL
    );
  }

  audioURL =
  URL.createObjectURL(file);

  audio.src =
  audioURL;

  audio.preload =
  "metadata";

  musicInfo.style.display =
  "block";

  musicName.textContent =
  file.name;

  await waitMetadata(audio);

  const duration =
  audio.duration;

  musicDuration.textContent =
  formatTime(duration);


  /*
    ATURAN:
    1 DETIK SAMPAI 35 DETIK
  */

  if(
    duration > 35
  ){

    musicValid.textContent =
    "● Musik terlalu panjang";

    musicValid.style.color =
    "#777";

    renderBtn.disabled =
    true;

    status.textContent =
    "Musik maksimal 35 detik.";

  }else{

    musicValid.textContent =
    "● Musik valid";

    musicValid.style.color =
    "#fff";

    renderBtn.disabled =
    false;

    status.textContent =
    "Musik siap digunakan.";
  }
});


/* =========================================
   INTENSITY
========================================= */

intensity.addEventListener(
"input",
() => {

  intensityText.textContent =
  intensity.value + "%";

});


/* =========================================
   AUDIO ENGINE
========================================= */

async function setupAudio(){

  if(audioCtx){

    await audioCtx.resume();

    return;
  }

  audioCtx =
  new(
    window.AudioContext ||
    window.webkitAudioContext
  )();

  analyser =
  audioCtx.createAnalyser();

  analyser.fftSize =
  1024;

  analyser.smoothingTimeConstant =
  .6;

  source =
  audioCtx.createMediaElementSource(
    audio
  );

  destination =
  audioCtx.createMediaStreamDestination();

  source.connect(
    analyser
  );

  analyser.connect(
    audioCtx.destination
  );

  analyser.connect(
    destination
  );
}


/* =========================================
   BASS DETECTOR
========================================= */

function getBass(){

  if(!analyser)
  return 0;

  const data =
  new Uint8Array(
    analyser.frequencyBinCount
  );

  analyser.getByteFrequencyData(
    data
  );

  let total = 0;

  const limit =
  Math.min(
    32,
    data.length
  );

  for(
    let i=1;
    i<limit;
    i++
  ){

    total += data[i];
  }

  let value =
  total /
  limit /
  255;

  value =
  Math.pow(
    value,
    .62
  );

  return Math.min(
    1,
    value
  );
}


/* =========================================
   BEAT DETECTOR
========================================= */

function detectBeat(
bass
){

  const now =
  performance.now();

  const rising =
  bass >
  previousBass * 1.15;

  const strong =
  bass > .47;

  const cooldown =
  now - lastBeat > 130;

  if(
    rising &&
    strong &&
    cooldown
  ){

    lastBeat =
    now;

    beatCount++;

    currentPhoto =
    beatCount %
    Math.max(
      1,
      photos.length
    );

    return true;
  }

  return false;
}


/* =========================================
   FRAME
========================================= */

function drawFrame(
bass,
beat
){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(!photos.length){

    drawIdle();

    return;
  }

  const img =
  photos[
    currentPhoto %
    photos.length
  ];

  const power =
  Number(
    intensity.value
  ) / 100;

  const strength =
  bass * power;

  let zoom =
  1 +
  strength * .22;

  let x = 0;

  let y = 0;

  let rotation = 0;

  const mode =
  effect.value;


  /* SHAKE */

  if(
    mode === "mix" ||
    mode === "shake"
  ){

    x =
    (Math.random()-.5) *
    25 *
    strength;

    y =
    (Math.random()-.5) *
    25 *
    strength;
  }


  /* ZOOM */

  if(
    mode === "mix" ||
    mode === "zoom"
  ){

    zoom =
    1 +
    strength * .27;
  }


  /* ROTATE */

  if(
    mode === "mix"
  ){

    rotation =
    (Math.random()-.5) *
    .06 *
    strength;
  }


  /* BEAT PUNCH */

  if(beat){

    zoom +=
    .06 * power;

    x +=
    (Math.random()-.5) *
    20 *
    power;

    y +=
    (Math.random()-.5) *
    20 *
    power;
  }


  drawCover(
    img,
    zoom,
    x,
    y,
    rotation
  );


  /* FLASH */

  if(
    (
      mode === "flash" ||
      mode === "mix"
    ) &&
    strength > .72
  ){

    ctx.fillStyle =
    `rgba(
      255,
      255,
      255,
      ${Math.min(
        .3,
        strength*.35
      )}
    )`;

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }


  /* GLITCH */

  if(
    (
      mode === "glitch" ||
      mode === "mix"
    ) &&
    strength > .58
  ){

    ctx.save();

    ctx.globalAlpha =
    .16;

    for(
      let i=0;
      i<4;
      i++
    ){

      ctx.fillStyle =
      i%2
      ? "#00eaff"
      : "#ff0055";

      ctx.fillRect(
        Math.random()*50,
        Math.random()*
        canvas.height,
        canvas.width,
        3+
        Math.random()*18
      );
    }

    ctx.restore();
  }


  /* VIGNETTE */

  const gradient =
  ctx.createRadialGradient(
    canvas.width/2,
    canvas.height/2,
    canvas.width*.15,
    canvas.width/2,
    canvas.height/2,
    canvas.height*.75
  );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.25)"
  );

  ctx.fillStyle =
  gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================
   IMAGE COVER
========================================= */

function drawCover(
img,
scale,
x,
y,
rotation
){

  const W =
  canvas.width;

  const H =
  canvas.height;

  const ratio =
  Math.max(
    W/img.width,
    H/img.height
  );

  const s =
  ratio * scale;

  const w =
  img.width * s;

  const h =
  img.height * s;

  ctx.save();

  ctx.translate(
    W/2+x,
    H/2+y
  );

  ctx.rotate(
    rotation
  );

  ctx.drawImage(
    img,
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.restore();
}


/* =========================================
   LOOP
========================================= */

function loop(){

  if(!running)
  return;

  const bass =
  getBass();

  const beat =
  detectBeat(bass);

  previousBass =
  bass;

  drawFrame(
    bass,
    beat
  );

  updateUI(
    bass
  );

  if(
    !audio.paused &&
    !audio.ended
  ){

    animationFrame =
    requestAnimationFrame(
      loop
    );
  }
}


/* =========================================
   PREVIEW
========================================= */

previewBtn.addEventListener(
"click",
async () => {

  if(!photos.length){

    status.textContent =
    "Tambahkan foto dulu.";

    return;
  }

  if(
    !audioFile ||
    audio.duration > 35
  ){

    status.textContent =
    "Musik maksimal 35 detik.";

    return;
  }

  await setupAudio();

  stop();

  currentPhoto =
  0;

  beatCount =
  0;

  lastBeat =
  0;

  previousBass =
  0;

  audio.currentTime =
  0;

  running =
  true;

  try{

    await audio.play();

    status.textContent =
    "Preview berjalan...";

    loop();

  }catch(e){

    status.textContent =
    "Tekan PREVIEW sekali lagi.";
  }
});


/* =========================================
   STOP
========================================= */

stopBtn.addEventListener(
"click",
() => {

  stop();

  status.textContent =
  "Preview dihentikan.";
});


function stop(){

  running =
  false;

  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );
  }

  audio.pause();
}


/* =========================================
   RENDER VIDEO
========================================= */

renderBtn.addEventListener(
"click",
async () => {

  if(rendering)
  return;

  if(!photos.length){

    status.textContent =
    "Tambahkan foto dulu.";

    return;
  }

  if(
    !audioFile ||
    audio.duration > 35
  ){

    status.textContent =
    "Musik maksimal 35 detik.";

    return;
  }

  rendering =
  true;

  renderBtn.disabled =
  true;

  previewBtn.disabled =
  true;

  download.style.display =
  "none";

  await setupAudio();

  stop();


  const videoStream =
  canvas.captureStream(30);

  const finalStream =
  new MediaStream();


  videoStream
  .getVideoTracks()
  .forEach(
    track =>
    finalStream.addTrack(track)
  );


  destination
  .stream
  .getAudioTracks()
  .forEach(
    track =>
    finalStream.addTrack(track)
  );


  let mime =
  "video/webm;codecs=vp9,opus";


  if(
    !MediaRecorder
    .isTypeSupported(mime)
  ){

    mime =
    "video/webm;codecs=vp8,opus";
  }


  if(
    !MediaRecorder
    .isTypeSupported(mime)
  ){

    mime =
    "video/webm";
  }


  chunks = [];


  recorder =
  new MediaRecorder(
    finalStream,
    {
      mimeType:mime,
      videoBitsPerSecond:
      6500000,
      audioBitsPerSecond:
      192000
    }
  );


  recorder.ondataavailable =
  e => {

    if(e.data.size){

      chunks.push(
        e.data
      );
    }
  };


  recorder.onstop =
  () => {

    const blob =
    new Blob(
      chunks,
      {
        type:mime
      }
    );

    const url =
    URL.createObjectURL(
      blob
    );

    download.href =
    url;

    download.download =
    "Mini-JJ-" +
    Date.now() +
    ".webm";

    download.style.display =
    "block";

    status.textContent =
    "Video selesai dibuat.";

    rendering =
    false;

    renderBtn.disabled =
    false;

    previewBtn.disabled =
    false;
  };


  currentPhoto =
  0;

  beatCount =
  0;

  lastBeat =
  0;

  previousBass =
  0;

  audio.currentTime =
  0;


  recorder.start(100);

  running =
  true;


  try{

    await audio.play();

  }catch(e){

    recorder.stop();

    return;
  }


  renderLoop();
});


/* =========================================
   RENDER LOOP
========================================= */

function renderLoop(){

  if(!rendering)
  return;

  const bass =
  getBass();

  const beat =
  detectBeat(
    bass
  );

  previousBass =
  bass;

  drawFrame(
    bass,
    beat
  );

  updateUI(
    bass
  );


  if(
    audio.ended ||
    audio.currentTime >=
    audio.duration-.05
  ){

    running =
    false;

    setTimeout(
      () => {

        if(
          recorder &&
          recorder.state !==
          "inactive"
        ){

          recorder.stop();
        }

      },
      200
    );

    return;
  }


  requestAnimationFrame(
    renderLoop
  );
}


/* =========================================
   UI
========================================= */

function updateUI(
bass
){

  const value =
  Math.round(
    bass*100
  );

  bassBar.style.width =
  value+"%";

  bassText.textContent =
  "BASS "+value+"%";

  timeText.textContent =
  formatTime(
    audio.currentTime
  );
}


/* =========================================
   IDLE
========================================= */

function drawIdle(){

  ctx.fillStyle =
  "#0b0b0d";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle =
  "#444";

  ctx.font =
  "bold 25px Arial";

  ctx.textAlign =
  "center";

  ctx.fillText(
    "TAMBAHKAN FOTO",
    canvas.width/2,
    canvas.height/2
  );
}


/* =========================================
   UTIL
========================================= */

function loadImage(
src
){

  return new Promise(
    resolve => {

      const img =
      new Image();

      img.onload =
      () =>
      resolve(img);

      img.src =
      src;
    }
  );
}


function waitMetadata(
media
){

  return new Promise(
    resolve => {

      if(
        media.readyState >= 1
      ){

        resolve();

      }else{

        media.addEventListener(
          "loadedmetadata",
          resolve,
          {once:true}
        );
      }
    }
  );
}


function formatTime(
seconds
){

  if(
    !isFinite(seconds)
  )
  return "00:00";

  const m =
  Math.floor(
    seconds/60
  );

  const s =
  Math.floor(
    seconds%60
  );

  return String(m)
  .padStart(2,"0")
  +":"+
  String(s)
  .padStart(2,"0");
}


/* =========================================
   START
========================================= */

drawIdle();

</script>
